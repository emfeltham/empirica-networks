factors:
  - desc: playerCount determines how many Players are in a Game.
    name: playerCount
    values:
      - value: 4
      - value: 5
      - value: 8
treatments:
  # 4 is the smallest ring where the guarantee is visible: each participant has
  # 2 neighbors and exactly 1 non-neighbor. On a ring of 3 everyone is
  # everyone's neighbor and the demo proves nothing.
  - desc: "Ring of 4 — each participant sees 2 of the other 3"
    factors:
      playerCount: 4
    name: Ring of 4
  - desc: "Ring of 8 — each participant sees 2 of the other 7"
    factors:
      playerCount: 8
    name: Ring of 8
