name: upstream drift

# The alarm for upstream drift.
#
# This package is built on public API, but four contracts are version-fragile
# and three of them fail SILENTLY rather than throwing:
#
#   - the TajribaProvider constructor shape
#   - the `dones` protocol — Attributes/Scopes resolve nothing unless fed
#     updated node ids, with no error
#   - AdminContext.init arity
#   - `ListenersCollector.attributeListeners` and the shape of the `unique`
#     wrapper, which the duplicate-listener detector reads
#     (src/admin/listeners.ts, PLATFORM-NOTES §18a). This is the only one that
#     depends on an `@internal` field. The detector calibrates the wrapper shape
#     at startup rather than hardcoding it, so it retunes itself rather than
#     going quiet — but if the FIELD moves or is renamed, the detector switches
#     off and consumers stop being warned about a real defect. Watched by
#     test/unit/listeners.test.ts and test/e2e/duplicate_listeners.test.ts, both
#     of which run below. If the e2e one fails saying the second handler DID
#     run, upstream fixed its dispatcher and the warning should be withdrawn.
#
# A silent break found by a researcher mid-study is the failure this job exists
# to prevent. It runs against @empirica/core@latest rather than the pinned
# range, so it is EXPECTED to be the first thing that goes red after an upstream
# release — that is the signal, not a flake.
#
# It has a second job, which is the reason the e2e step below is not optional.
# Several upstream findings are pinned by tests that assert the CURRENT BROKEN
# behavior, so a FIX upstream turns them red too, with a message saying what to
# close. This is the only thing that runs them against a version where they could
# pass:
#
#   - the lifecycle dispatcher, test/e2e/duplicate_listeners.test.ts — the second
#     handler never ran
#   - attributes(), test/e2e/participant_write.test.ts — it returns internal
#     system error. That one carries the largest consequence, because ISSUES.md
#     O11's declared-keys design rests on there being no attribute enumeration at
#     any layer; the assertion message says so.
#
# The complementary alarm is test/unit/upstream_pin.test.ts, which fires on the
# other event: not "upstream moved" but "we moved to it", listing every dated
# measurement still citing the version left behind (ISSUES.md O7b).
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest:
    name: "@empirica/core@latest"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Record the pinned version, then upgrade
        id: versions
        run: |
          PINNED=$(node -p "require('./node_modules/@empirica/core/package.json').version")
          npm install --no-save @empirica/core@latest
          LATEST=$(node -p "require('./node_modules/@empirica/core/package.json').version")
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "### @empirica/core $PINNED -> $LATEST" >> "$GITHUB_STEP_SUMMARY"

      # No-op when upstream has not moved. Empirica's core has been quiet since
      # May 2025, so most weeks this is the path taken — skipping keeps a green
      # run meaningful instead of re-testing the pinned version weekly under a
      # name that says otherwise.
      - name: Nothing to test
        if: steps.versions.outputs.pinned == steps.versions.outputs.latest
        run: echo "Unchanged at ${{ steps.versions.outputs.pinned }}; nothing to check." >> "$GITHUB_STEP_SUMMARY"

      - name: Install the Empirica CLI
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        run: |
          curl -fsSL https://install.empirica.dev | sh
          for d in /usr/local/bin "$HOME/.empirica/bin" "$HOME/.local/bin"; do
            [ -x "$d/empirica" ] && echo "$d" >> "$GITHUB_PATH"
          done
          true

      - name: Typecheck against latest
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        run: npm run check

      # Mode tests first and reported separately: they drive a synthetic
      # TajribaProvider and are the tier that catches a `dones` protocol change,
      # which e2e can mask by simply timing out somewhere else.
      - name: Mode tests (the dones contract)
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        run: npm test -- unit mode

      - name: e2e against latest
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        run: npm test -- e2e
