name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref. e2e spawns real
# Tajriba servers on fixed ports, so overlapping runs on one runner would
# collide rather than merely waste time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap tiers, across the Node versions the package claims to support
  # (`engines: >=20`). No Empirica CLI needed: unit and mode never spawn a
  # server, which is exactly why they are separated from e2e here.
  unit:
    name: unit + mode (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Even-numbered LTS lines only. Add 26 when it ships — the point of the
        # matrix is to catch a newer Node breaking us, so the newest current
        # release matters more than breadth.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- unit mode

      # Documentation links, on one Node version only — the result cannot differ
      # across them, and three copies of the same failure is noise. Relative
      # paths and section anchors only, never external URLs: those would make a
      # green run depend on other people's uptime. Anchors are the ones that
      # actually rot here, since PLATFORM-NOTES numbers its sections by
      # discovery order and therefore renumbers them.
      - run: npm run check:links
        if: matrix.node == '22'

  # The tier that proves the actual guarantee. Current Node only: it needs the
  # Empirica CLI and a real Tajriba, and running that three times over would
  # triple the slowest job to re-test the same server binary.
  e2e:
    name: e2e (real Tajriba)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Install the Empirica CLI
        run: |
          curl -fsSL https://install.empirica.dev | sh
          # Locate it rather than hard-coding: the installer puts the binary in
          # /usr/local/bin on macOS, and its target is not documented as stable
          # across versions or platforms. Adding a directory already on PATH is
          # harmless, so this stays correct if the installer moves.
          for d in /usr/local/bin "$HOME/.empirica/bin" "$HOME/.local/bin"; do
            [ -x "$d/empirica" ] && echo "$d" >> "$GITHUB_PATH"
          done
          true
      - name: Confirm the CLI is on PATH
        # Fail here with a clear message rather than 20 tests deep in a spawn
        # ENOENT: the harness's own error is good, but 25 copies of it are not.
        run: empirica version

      - run: npm test -- e2e

      # The privacy claim, run the way a reviewer would run it. This is the
      # command the README tells people to trust, so CI has to exercise the
      # command itself and not just the library it wraps.
      - run: npm run build
      - run: node dist/verify/cli.cjs verify --n 4

      # Every `empirica-networks` import written in the docs, resolved against
      # what was just built. Here rather than in the `unit` job because it needs
      # dist, and this is the job that already builds. It catches the drift a
      # link checker cannot see: an export renamed out from under a snippet that
      # still reads correctly.
      - run: npm run check:docs

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tajriba-logs
          path: |
            **/tajriba.log
            .empirica/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The examples are documentation, so nothing fails when the API moves under them.
  # Their server halves are covered by test/e2e/example.test.ts, shirado2017.test.ts
  # and rand2011.test.ts; this covers the client halves, which only a real build can
  # catch (imports, JSX, exports map).
  #
  # ALL of them, via a script that iterates the directory. This job built only
  # `minimal` until M6 Tier 4 — the line was written when there was one example, two
  # more arrived in M5, and the line did not change, so their clients had never been
  # built at all. A hard-coded path per example is how that happens twice.
  example:
    name: example builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Installs a packed tarball rather than linking: a `file:` link resolves
      # to the repo root, whose node_modules holds a second copy of
      # @empirica/core, and two copies break every instanceof inside Empirica.
      # See docs/PLATFORM-NOTES.md §10.
      - run: npm run example:install
      - run: npm run example:build
